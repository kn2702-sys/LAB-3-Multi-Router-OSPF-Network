! LAB 3 — PHASE 1 STATIC — R3
enable
configure terminal
hostname R3
no ip domain-lookup
!
interface GigabitEthernet0/0
 description LAN-C
 ip address 10.3.3.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R2
 ip address 10.1.23.2 255.255.255.252
 no shutdown
!
ip route 10.1.1.0 255.255.255.0 10.1.23.1
!
end
write memory
