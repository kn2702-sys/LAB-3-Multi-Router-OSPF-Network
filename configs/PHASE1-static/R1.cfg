! LAB 3 — PHASE 1 STATIC — R1
enable
configure terminal
hostname R1
no ip domain-lookup
!
interface GigabitEthernet0/0
 description LAN-A
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R2
 ip address 10.1.12.1 255.255.255.252
 no shutdown
!
! Remote LAN-C via R2
ip route 10.3.3.0 255.255.255.0 10.1.12.2
!
end
write memory
