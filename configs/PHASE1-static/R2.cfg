! LAB 3 — PHASE 1 STATIC — R2 (transit)
enable
configure terminal
hostname R2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-R1
 ip address 10.1.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R3
 ip address 10.1.23.1 255.255.255.252
 no shutdown
!
ip route 10.1.1.0 255.255.255.0 10.1.12.1
ip route 10.3.3.0 255.255.255.0 10.1.23.2
!
end
write memory
