! LAB 3 — PHASE 2 OSPF — R3
enable
configure terminal
hostname R3
no ip domain-lookup
!
interface GigabitEthernet0/0
 description LAN-C
 ip address 10.3.3.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R2
 ip address 10.1.23.2 255.255.255.252
 no shutdown
!
no ip route 10.1.1.0 255.255.255.0 10.1.23.1
!
router ospf 1
 router-id 3.3.3.3
 network 10.3.3.0 0.0.0.255 area 0
 network 10.1.23.0 0.0.0.3 area 0
!
end
write memory
