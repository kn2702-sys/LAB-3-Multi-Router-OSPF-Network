! LAB 3 — PHASE 2 OSPF — R1
! After PHASE1 works: remove statics, enable OSPF Area 0
enable
configure terminal
hostname R1
no ip domain-lookup
!
interface GigabitEthernet0/0
 description LAN-A
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R2
 ip address 10.1.12.1 255.255.255.252
 no shutdown
!
no ip route 10.3.3.0 255.255.255.0 10.1.12.2
!
router ospf 1
 router-id 1.1.1.1
 network 10.1.1.0 0.0.0.255 area 0
 network 10.1.12.0 0.0.0.3 area 0
!
end
write memory
