! LAB 3 — PHASE 2 OSPF — R2
enable
configure terminal
hostname R2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TO-R1
 ip address 10.1.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO-R3
 ip address 10.1.23.1 255.255.255.252
 no shutdown
!
no ip route 10.1.1.0 255.255.255.0 10.1.12.1
no ip route 10.3.3.0 255.255.255.0 10.1.23.2
!
router ospf 1
 router-id 2.2.2.2
 network 10.1.12.0 0.0.0.3 area 0
 network 10.1.23.0 0.0.0.3 area 0
!
end
write memory
